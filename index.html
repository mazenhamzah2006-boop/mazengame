<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAZEN GAME</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #15152b;
      font-family: Arial, sans-serif;
      color: white;
    }

    .game {
      width: min(92%, 400px);
      padding: 30px 22px;
      text-align: center;
      background: #204b91;
      border-radius: 22px;
      box-shadow: 0 0 30px #00e5ff30;
    }

    h1 { color: #00e5ff; font-size: 29px; }
    p { font-size: 17px; }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 0;
      border-radius: 10px;
      font-size: 22px;
      text-align: center;
    }

    button {
      padding: 13px 20px;
      margin: 8px;
      border: 0;
      border-radius: 10px;
      background: #00c853;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      min-height: 50px;
      color: #ffd740;
      line-height: 1.7;
    }

    .new { background: #ffffff; color: #15152b; }
  </style>
</head>
<body>
  <main class="game">
    <h1>🎮 MAZEN GAME</h1>
    <p>خمن الرقم من 1 إلى 100</p>

    <input id="guess" type="number" min="1" max="100"
      placeholder="اكتب رقمك">

    <button id="play" onclick="checkGuess()">🎯 خمن الرقم</button>

    <p id="result">يلا نشوف هتكسب ولا لأ! 😎</p>

    <button class="new" onclick="newGame()">🔄 لعبة جديدة</button>
  </main>

  <script>
    let secret = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;

    function checkGuess() {
      const input = document.getElementById("guess");
      const result = document.getElementById("result");
      const button = document.getElementById("play");
      const number = Number(input.value);

      if (!input.value || number < 1 || number > 100 ||
          !Number.isInteger(number)) {
        result.textContent = "⚠️ اكتب رقم صحيح من 1 إلى 100";
        return;
      }
      attempts++;

      if (number < secret) {
        result.textContent = "⬆️ الرقم أكبر! جرب تاني";
      } else if (number > secret) {
        result.textContent = "⬇️ الرقم أصغر! جرب تاني";
      } else {
        result.textContent =
         
        button.disabled = true;
      }
    }

    function newGame() {
      secret = Math.floor(Math.random() * 100) + 1;
      attempts = 0;
      document.getElementById("guess").value = "";
      document.getElementById("result").textContent =
        "يلا نشوف هتكسب ولا لأ! 😎";
      document.getElementById("play").disabled = false;
    }

    document.getElementById("guess").addEventListener("keydown", e => {
      if (e.key === "Enter") checkGuess();
    });
  </script>
</body>
</html>
